<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cheerful Void Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0a10; --ink2:#12111a; --card:#17151f; --card2:#1d1a27; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#ece8f3; --dim:#a39cba; --faint:#6a6482;
  --violet:#8b7cf7; --ember:#ff7a45; --bone:#d8cfc0; --blood:#e3455a;
  --teal:#2dd4bf; --gold:#d9a441; --cyan:#56b8ff;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  background:var(--ink); color:var(--text);
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  font-size:15px; line-height:1.6; overflow-x:hidden; min-height:100vh;
  padding:env(safe-area-inset-top) 0 0;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%, color-mix(in srgb, var(--glow,#8b7cf7) 13%, transparent), transparent 62%),
    radial-gradient(ellipse 60% 40% at 90% 110%, rgba(86,184,255,.05), transparent 60%);
  transition:background .4s;
}
button{font-family:inherit;color:inherit}
#app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.005em}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:600}
.top h1{font-size:34px;line-height:1.05;margin-top:4px}
.top h1 em{font-style:italic;color:var(--violet)}
.iconbtn{flex:none;background:var(--ink2);border:1px solid var(--line);color:var(--dim);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;display:grid;place-items:center}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--gold);background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.25);border-radius:30px;padding:4px 11px;margin-top:10px}

/* ---------- generic panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-h h2{font-size:23px}
.link{background:none;border:none;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0}
.muted{color:var(--dim);font-size:13.5px}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:26px 2px 12px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.primary{background:var(--uc,var(--violet));color:#0b0a10}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--uc);border:1px solid color-mix(in srgb,var(--uc) 40%, transparent);border-radius:30px;padding:4px 11px}

/* ---------- check-in ---------- */
.dial{margin-bottom:16px}
.dial-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dial-top b{font-size:14px;font-weight:600}
.dial-top span{font-size:12.5px;color:var(--faint)}
.dial-val{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--dc);min-width:28px;text-align:right}
input[type=range]{width:100%;accent-color:var(--dc);height:28px}
.dial-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-2px}
.trend{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.trend:first-of-type{border-top:none}
.trend .nm{font-size:13px;font-weight:600}
.trend .nm small{display:block;color:var(--faint);font-weight:500;font-size:11px}
.trend .v{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--dc);text-align:right}
.bars{display:flex;gap:3px;height:30px;align-items:flex-end}
.bars i{flex:1;background:var(--dc);opacity:.35;border-radius:3px;min-height:3px}
.bars i.today{opacity:1}
.bars i.none{background:rgba(255,255,255,.07);opacity:1;height:3px}
.insight{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:13.5px;color:var(--dim)}
.insight button{background:none;border:none;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit;padding:0}

/* ---------- today's move ---------- */
.move{border-color:color-mix(in srgb,var(--uc) 35%, transparent)}
.move::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 100% 70% at 100% 0%, color-mix(in srgb,var(--uc) 16%, transparent), transparent 65%)}
.move > *{position:relative}
.move h3{font-size:30px;line-height:1.1;margin:14px 0 8px}
.move .idea{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;color:var(--dim);margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:16px}
.pill b{color:var(--uc)}

.mini{background:none;border:none;padding:0;font:inherit;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.mini .big{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1;color:var(--violet);min-width:44px}
.mini h3{font-size:20px;line-height:1.2}
.mini .arrow{margin-left:auto;color:var(--faint);font-size:22px}

/* ---------- path ---------- */
.overall{display:flex;gap:3px;margin:8px 0 6px}
.overall i{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--uc) 18%, transparent)}
.overall i.on{background:var(--uc)}
.unit{margin-top:30px}
.unit-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.unit-n{font-family:var(--serif);font-size:44px;font-weight:700;line-height:.9;color:var(--uc)}
.unit-h h2{font-size:27px;line-height:1.1}
.unit-h .sub{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.unit-intro{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.45;color:var(--dim);margin:8px 0 14px 2px}
.steps{position:relative;padding-left:4px}
.step{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;text-align:left;padding:10px 6px 10px 0;cursor:pointer;position:relative}
.step + .step::before{content:"";position:absolute;left:13px;top:-12px;height:24px;width:2px;background:color-mix(in srgb,var(--uc) 25%, transparent)}
.node{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--uc) 45%, transparent);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--uc);background:var(--ink);position:relative;z-index:1}
.step.done .node{background:var(--uc);border-color:var(--uc);color:#0b0a10}
.step.current .node{box-shadow:0 0 0 5px color-mix(in srgb,var(--uc) 18%, transparent);border-color:var(--uc)}
.step .t{flex:1;min-width:0}
.step .t b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.step .t span{font-size:12.5px;color:var(--faint)}
.step .go{color:var(--faint);font-size:18px}
.step.current .t b{color:var(--uc)}

/* ---------- lesson ---------- */
.back{background:none;border:none;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:14px}
.lesson-hero{margin-bottom:24px}
.lesson-hero .num{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:16px 0 6px}
.lesson-hero h1{font-size:40px;line-height:1.05}
.lesson-hero .idea{font-family:var(--serif);font-size:22px;line-height:1.38;font-weight:500;margin-top:16px;padding-left:16px;border-left:3px solid var(--uc)}
.sec{margin-bottom:16px}
.sec-n{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--uc);margin-bottom:12px}
.sec-n i{font-style:normal;font-family:var(--serif);font-size:18px;letter-spacing:0}
.life{font-size:16px;line-height:1.7}
.practice h3{font-size:26px;line-height:1.15;margin-bottom:4px}
.practice .min{font-size:12.5px;color:var(--faint);margin-bottom:16px}
.practice ol{list-style:none;counter-reset:s;margin-bottom:18px}
.practice li{counter-increment:s;position:relative;padding:0 0 14px 40px;font-size:15px;line-height:1.55}
.practice li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--uc) 16%, transparent);color:var(--uc);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.tried{font-size:12.5px;color:var(--faint);text-align:center;margin-top:10px}
.prompt{font-family:var(--serif);font-size:21px;line-height:1.35;font-weight:600;margin-bottom:14px}
textarea{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:14px;color:var(--text);padding:13px 14px;font-size:15px;font-family:inherit;line-height:1.55;min-height:120px;resize:vertical;margin-bottom:12px}
textarea:focus,select:focus,input:focus{outline:2px solid color-mix(in srgb,var(--uc,var(--violet)) 60%, transparent);outline-offset:1px}
details.dc{border-top:1px solid var(--line)}
details.dc:first-of-type{border-top:none}
details.dc summary{list-style:none;cursor:pointer;padding:13px 26px 13px 0;font-size:15px;font-weight:600;line-height:1.4;position:relative}
details.dc summary::-webkit-details-marker{display:none}
details.dc summary::after{content:"+";position:absolute;right:2px;top:10px;font-size:20px;color:var(--faint);font-weight:400}
details.dc[open] summary::after{content:"–"}
details.dc p{font-size:14.5px;line-height:1.65;color:var(--dim);padding:0 0 16px}
.lesson-foot{margin-top:24px;display:grid;gap:10px}

/* ---------- toolkit ---------- */
.tool{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.tool summary{list-style:none;cursor:pointer;padding:18px 44px 18px 18px;position:relative}
.tool summary::-webkit-details-marker{display:none}
.tool summary::after{content:"›";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--faint);transition:transform .2s}
.tool[open] summary::after{transform:translateY(-50%) rotate(90deg)}
.tool .when{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--uc);font-weight:700}
.tool h3{font-size:22px;line-height:1.2;margin-top:3px}
.tool .body{padding:0 18px 18px}
.tool ol{padding-left:20px;margin-bottom:12px}
.tool li{margin-bottom:8px;font-size:15px}
.tool li::marker{color:var(--uc);font-weight:700}

/* ---------- notes ---------- */
.note{padding:16px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:none;padding-top:0}
.note-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.note-h .d{font-size:12px;color:var(--faint)}
.note .q{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--dim);margin-bottom:6px;line-height:1.4}
.note .tx{white-space:pre-wrap;font-size:15px}
.x{background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;padding:0 4px}
.empty{text-align:center;padding:30px 10px;color:var(--faint);font-size:14px}

/* ---------- recall ---------- */
.study-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.counter{font-size:12px;color:var(--faint);letter-spacing:.08em}
.progress{height:4px;background:rgba(255,255,255,.07);border-radius:3px;margin-bottom:22px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--uc);border-radius:3px;transition:width .3s ease}
.cardwrap{perspective:1200px;margin-bottom:18px}
.flashcard{position:relative;width:100%;min-height:360px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.25,1);cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;overflow-y:auto}
.face::before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:radial-gradient(ellipse 120% 60% at 50% 0%, color-mix(in srgb, var(--uc) 10%, transparent), transparent 60%)}
.face.back{transform:rotateY(180deg)}
.qtext{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.3;flex:1;display:flex;align-items:center;margin-top:14px}
.atext{font-size:15.5px;line-height:1.65;flex:1;display:flex;align-items:center;margin-top:14px}
.hint{margin-top:14px;text-align:center;font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;opacity:0;pointer-events:none;transition:opacity .25s}
.grades.show{opacity:1;pointer-events:auto}
.grade{border-radius:14px;padding:14px 6px;font-size:14px;font-weight:700;cursor:pointer}
.grade small{display:block;font-weight:500;font-size:10px;opacity:.75;margin-top:2px}
.g-again{background:#4a2130;border:1px solid rgba(227,69,90,.4);color:#ff8fa0}
.g-hard{background:#3d3420;border:1px solid rgba(217,164,65,.4);color:#f0c877}
.g-good{background:#16352f;border:1px solid rgba(45,212,191,.4);color:#6ee7d4}
.done{text-align:center;padding:60px 10px}
.done .glyph{font-family:var(--serif);font-size:56px;color:var(--violet);line-height:1}
.done h2{font-size:30px;margin:14px 0 8px}
.done p{color:var(--dim);font-size:14.5px;max-width:330px;margin:0 auto 24px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,10,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabbar nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;letter-spacing:.02em}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--text)}
.tab.on svg{stroke:var(--violet)}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,4,10,.75);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--ink2);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:600px;padding:22px 18px calc(30px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal h2{font-size:26px;margin-bottom:6px}
.modal label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px;font-weight:600}
.modal select,.modal input{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:12px;color:var(--text);padding:12px;font-size:15px;font-family:inherit}
.modal textarea{min-height:80px}
.menu{display:grid;gap:10px;margin-top:16px}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#221f30;border:1px solid var(--line2);color:var(--text);padding:10px 18px;border-radius:30px;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (max-width:380px){ .top h1{font-size:30px} .lesson-hero h1{font-size:34px} .trend{grid-template-columns:84px 1fr 26px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="tabbar" id="tabbar"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
/* =========================================================
   THE CHEERFUL VOID · FIELD GUIDE
   A 6-unit path: Notice → Look Under It → Read the Monsters →
   Unhook → Choose → Practice. Each lesson: the idea, where it
   shows up in real life, a practice for today, a journal prompt,
   and the original study cards as "go deeper" material.
   Daily 4-dial check-in. Optional spaced-repetition recall
   (5-box Leitner: 0/1/3/7/21 days) over cards from opened lessons.
   ========================================================= */

/* ---------- safe storage (works in artifact preview AND GitHub Pages) ---------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

/* ---------- source decks (labels for cards and custom cards) ---------- */
const DECKS = {
  burnout:{ name:"Burnout", hex:"#ff7a45" },
  on:{ name:"Optimistic Nihilism", hex:"#8b7cf7" },
  tmt:{ name:"Terror Management", hex:"#d8cfc0" },
  horror:{ name:"Horror & Mind", hex:"#e3455a" },
  act:{ name:"ACT & Flexibility", hex:"#2dd4bf" },
  phil:{ name:"The Lineage", hex:"#d9a441" },
  syn:{ name:"Synthesis", hex:"#56b8ff" }
};

/* ---------- the path ---------- */
const UNITS = [
  {id:"notice", name:"Notice", sub:"Name what's happening", hex:"#ff7a45",
   intro:"It's 4:40 at the nurses' station and you can't remember the last patient's name. Start here. Burnout has a shape, and you can measure it."},
  {id:"dread", name:"Look Under It", sub:"The fear beneath everything", hex:"#d8cfc0",
   intro:"Someone in room 6 is dying and you're thinking about lunch. That's the system working. This unit is about the dread underneath and the walls we build to keep it quiet."},
  {id:"monsters", name:"Read the Monsters", sub:"Horror as a clinical lens", hex:"#e3455a",
   intro:"Lights off, a movie you've seen 4 times, and your pulse climbs anyway. Horror is a safe room to practice being scared. It's also the best vocabulary I know for what goes on inside people."},
  {id:"unhook", name:"Unhook", sub:"Psychological flexibility", hex:"#2dd4bf",
   intro:"Your brain says you're bad at your job. It said that yesterday too. Here you learn to hold thoughts loosely and keep moving toward what you care about while they talk."},
  {id:"choose", name:"Choose", sub:"Optimistic Nihilism", hex:"#8b7cf7",
   intro:"Stand in a dark yard long enough and the sky gets huge. You get small. That's the good news: nothing out there assigned you a meaning, so you get to make one."},
  {id:"practice", name:"Practice", sub:"Make it a system", hex:"#56b8ff",
   intro:"Thursday, 2 weeks into a plan you half kept. This is where the ideas turn into a calendar. Small experiments, honest data, run it again."}
];

const LESSONS = [
/* ---------- 1 · NOTICE ---------- */
{id:"n1",unit:"notice",title:"Burnout has a shape",
 idea:"Exhaustion first, then distance, then the creeping sense you're bad at this now. It finds the most devoted people first.",
 life:"You used to stay late because you wanted to. Now you stay late and feel nothing about it, and the jokes at handoff got meaner. That's what chronic, unmanaged stress does to a normal person. It does it on a schedule.",
 practice:{name:"The column audit",min:10,steps:["Draw 3 columns: Tank, Distance, Doubt.","Under each, write 1 moment from this week where it showed up.","Circle the loudest column. That's your starting point."]},
 prompt:"When did you last feel like the person who chose this work? Where were you standing?",
 cards:["bo01","bo02","bo03","bo09","bo05"]},
{id:"n2",unit:"notice",title:"The numbing",
 idea:"Distance is how an exhausted mind tries to stop the bleeding. It works for about a week.",
 life:"Bed 4 becomes 'the gallbladder.' Your partner's bad day turns into background noise. You catch yourself watching people the way you'd watch the TV in a waiting room.",
 practice:{name:"Re-humanize 1 person",min:5,steps:["Pick 1 person you've flattened into a role today. A patient, a coworker, your kid's teacher.","Find 1 specific, useless detail about them. Their dog's name. The sticker on their water bottle.","Use it, out loud or in your head, the next time you see them."]},
 prompt:"Who have you turned into a case number lately? What did that protect you from?",
 cards:["bo06","sy06","ho05","sy11"]},
{id:"n3",unit:"notice",title:"Get a baseline",
 idea:"Exhaustion warps the instrument doing the measuring, which is you. Numbers catch the drift your mood can't.",
 life:"Ask a burned-out person how they're doing and they'll say 'fine, busy.' They believe it. The slide is slow enough to feel normal.",
 practice:{name:"Start the daily check-in",min:2,steps:["Open Today and rate your 4 dials. First number wins.","Do it at the same time tomorrow. Tie it to something you already do, like coffee or parking the car.","After 14 days, read the trend before you decide how you feel about it."]},
 prompt:"What would you have rated yourself 6 months ago? What changed between then and now?",
 cards:["bo04","bo07","bo24","bo19"]},
{id:"n4",unit:"notice",title:"Match the fix to the wound",
 idea:"Depletion and moral injury feel identical from the inside, and depression can hide in both. Rest only fixes 1 of them.",
 life:"You took a week off and came back worse. Maybe it was never the hours. Maybe it's being asked to do something you think is wrong, 30 times a day.",
 practice:{name:"Wound sort",min:10,steps:["List what's draining you this month. Be petty and specific.","Mark each one D (too much), M (against my values), or E (everywhere, even at home).","D gets a resource or a boundary. M gets a voice, in writing, to someone. E gets screened: talk to your PCP or a therapist this week."]},
 prompt:"What does your job ask you to do that you'd never choose? What would it cost to say so out loud?",
 cards:["bo08","bo11","bo10"]},
{id:"n5",unit:"notice",title:"Where you are right now",
 idea:"Change moves in loops. Your stage decides which kind of help lands.",
 life:"Someone tells you to 'just set boundaries' and you want to throw your phone. You weren't ready to act yet. You were still deciding whether there was a problem.",
 practice:{name:"Stage check",min:5,steps:["Pick the 1 change you keep circling. Sleep, drinking, quitting, saying no.","Choose your honest stage: no problem, maybe, planning, doing, keeping it.","Take only the next stage's step. 'Maybe' means list what staying the same costs you. 'Planning' means a written plan with a date on it."]},
 prompt:"What change have you been about to make for over a year? What does staying put pay you?",
 cards:["bo12","bo13","bo14","bo15","bo16","sy13"]},

/* ---------- 2 · LOOK UNDER IT ---------- */
{id:"d1",unit:"dread",title:"The worm at the core",
 idea:"You know you're going to die. A lot of what you build is there to keep that fact quiet.",
 life:"On the anniversary of a death you clean the whole house. At 2 a.m. it's retirement accounts. Then a sudden, urgent need to finish the book. Same engine every time.",
 practice:{name:"Spot the project",min:10,steps:["Write down what you hope outlasts you. Kids, work, a name, a building.","Next to each, write how it feels to imagine it gone.","Notice which ones you can hold loosely and which ones grip back."]},
 prompt:"What's your immortality project? Who would you be if it failed?",
 cards:["tm01","tm02","tm11","tm21","ph14"]},
{id:"d2",unit:"dread",title:"How we hide",
 idea:"When death is in the room, we argue it away. When it's just outside the room, we defend our worldview harder and never connect the 2.",
 life:"After a code you're suddenly furious about a coworker's politics. After a funeral you buy something expensive. The reaction lands somewhere that looks unrelated.",
 practice:{name:"After-death inventory",min:5,steps:["Next time you're near a death, a bad diagnosis, or a scary headline, set a reminder for 2 hours later.","When it goes off, ask: what am I judging harder than usual right now?","Write it down. You just caught a defense in the wild."]},
 prompt:"Think about your last brush with mortality. What did you do in the 24 hours after?",
 cards:["tm06","tm07","tm08","tm03","tm04"]},
{id:"d3",unit:"dread",title:"Your buffers",
 idea:"Feeling like you matter, and having people close, hold back the dread. Burnout eats those walls from the inside.",
 life:"You lose the job and it feels like dying. That's a buffer failing. Whatever it was holding back comes in all at once.",
 practice:{name:"Buffer check",min:5,steps:["Rate 0 to 10: does my life mean something right now? Do I matter to the people around me? How connected do I feel?","Find the lowest number.","Do 1 small thing for that buffer today. Text someone. Finish something. Show up to the thing."]},
 prompt:"Which of your buffers is running on fumes? When did that start?",
 cards:["tm09","tm10","tm13","tm16","tm12"]},
{id:"d4",unit:"dread",title:"Dread goes public",
 idea:"Scared people punish harder and trust outsiders less. Know the pattern, and hold the specific studies loosely.",
 life:"Judges reminded of their own death set bond 9 times higher. A pandemic year and everybody's angrier at everybody. I'm in that sample too. So are you.",
 practice:{name:"Hold the verdict",min:5,steps:["Notice the next harsh judgment you make about a stranger, a patient, or a group.","Ask: is death closer than usual for me today?","If yes, wait 24 hours before you act on the verdict."]},
 prompt:"Who do you judge hardest when you're scared? What do they threaten?",
 cards:["tm05","tm14","tm15","tm17"]},
{id:"d5",unit:"dread",title:"Death is a coworker",
 idea:"Healthcare runs on chronic mortality salience. Your exhaustion tracks that load as much as the hours.",
 life:"Your neighbor works the same hours at a desk and isn't wrecked the way you are. They didn't deliver bad news to 2 families before lunch.",
 practice:{name:"Close the loop",min:2,steps:["After a hard death or diagnosis, take 90 seconds before the next room.","Say the person's name to yourself and 1 thing you noticed about them.","Breathe out and go. A tiny funeral repairs more than you'd think."]},
 prompt:"Whose death is still riding around with you? What would a small ritual for them look like?",
 cards:["tm18","tm19","sy04","sy05"]},

/* ---------- 3 · READ THE MONSTERS ---------- */
{id:"h1",unit:"monsters",title:"Fear with an exit door",
 idea:"Horror is chosen dread at a dose you control. That makes it practice.",
 life:"You grip the armrest, the thing jumps, you laugh. Your body just ran a full threat response and came out the other side in under 4 seconds. That's a rep.",
 practice:{name:"Prescribed scare",min:90,steps:["Pick a movie, story, or game 1 notch scarier than comfortable.","While it's on, notice your body. Jaw, breath, hands. Name each spike.","After, write 1 line: what did I sit through that I'd usually avoid?"]},
 prompt:"What scared you as a kid that doesn't now? What changed?",
 cards:["ho01","ho03","ho04","ho15","ho14"]},
{id:"h2",unit:"monsters",title:"Rehearsal",
 idea:"People who'd voluntarily simulated catastrophe were less blindsided when a real one showed up.",
 life:"March 2020. The friend who'd watched every outbreak movie had a plan and a stocked pantry. Most of us were refreshing the news and buying a 7th bottle of hand soap.",
 practice:{name:"Worst-case walkthrough",min:10,steps:["Pick 1 thing you're dreading this month.","Run it like a movie: the worst version, scene by scene, about a character who isn't you.","Pause at the scariest frame. What does the main character do next? Write that."]},
 prompt:"What catastrophe do you rehearse without meaning to? Is the rehearsal helping?",
 cards:["ho02","ho20","ho19","ho16"]},
{id:"h3",unit:"monsters",title:"The bestiary",
 idea:"Every monster is a clinical picture. Naming the creature gives you a handle on the thing.",
 life:"The vampire is the relationship that charms you and empties you. The werewolf is the rage that 'wasn't me.' Body horror is a diagnosis. Possession is the thought that won't leave.",
 practice:{name:"Name your monster",min:5,steps:["Which monster has been in your house lately?","Write 2 sentences about it in 3rd person, like a field guide entry.","Add 1 line: what does it want from me?"]},
 prompt:"If your hardest week this year were a horror movie, what's the monster and how does it end?",
 cards:["ho06","ho08","ho11","ho12"]},
{id:"h4",unit:"monsters",title:"Haunted places",
 idea:"Grief that never finished turns into a haunting. Every haunted house has a room nobody opens.",
 life:"The holiday where nobody mentions Dad. The kitchen drawer still full of old prescriptions. The family that walks into the same argument every year like a ghost in the same hallway.",
 practice:{name:"Open 1 door",min:15,steps:["Pick a locked room: something you or your family never talk about.","Write about it for 10 minutes without editing. Nobody reads this.","Close the notebook and do something with your hands. Dishes count."]},
 prompt:"What room in your history stays shut? What's in it?",
 cards:["ho07","ho13","ho17","ho09"]},
{id:"h5",unit:"monsters",title:"Monster talk",
 idea:"A shared metaphor lowers the defenses. The creature carries the shame so the person doesn't have to.",
 life:"A patient can't say 'I feel dead inside.' They can say 'I've been a zombie since January.' Now you're talking. The dark joke in the break room does the same job for staff.",
 practice:{name:"Offer a monster",min:5,steps:["In your next hard conversation, offer a creature. 'Does it feel more like a ghost or a vampire?'","Let them take it or reject it. Both answers are data.","Talk about the creature first. The person comes after."]},
 prompt:"What dark joke got you through a bad shift? What was it really saying?",
 cards:["ho18","sy07","sy16"]},

/* ---------- 4 · UNHOOK ---------- */
{id:"a1",unit:"unhook",title:"Bring it along",
 idea:"The aim is to live well while you feel whatever you feel. Feeling better is a bonus.",
 life:"You've spent years trying to get the anxiety to 0 before you do the thing. The anxiety keeps winning. Maybe it rides in the car with you.",
 practice:{name:"5 minutes, as is",min:5,steps:["Pick 1 thing you've been putting off until you feel ready.","Rate the discomfort 0 to 10. Leave it there.","Do the first 5 minutes with the number exactly where it is."]},
 prompt:"What have you been waiting to feel ready for? How long have you been waiting?",
 cards:["ac01","ac02","ac15","ac14"]},
{id:"a2",unit:"unhook",title:"Quicksand",
 idea:"Struggling against pain is what pulls people under. Willingness means making room for it, even while you hate it.",
 life:"The scrolling, the 3rd glass, the 'I'm fine.' Each one buys 20 minutes of relief. Add up the minutes and your life got smaller.",
 practice:{name:"Willingness dial",min:5,steps:["When something hurts today, rate 2 numbers: how bad it is, and how willing you are to have it.","Leave the first number alone. Nudge the second up by 1.","Notice what your shoulders do when you stop pushing."]},
 prompt:"List everything you've tried to make a feeling go away. Has any of it worked long term?",
 cards:["ac03","ac05","ac10","ac17","ac08"]},
{id:"a3",unit:"unhook",title:"Thoughts are thoughts",
 idea:"'I'm a failure' becomes 'I'm having the thought that I'm a failure.' Same words. The thought loses the steering wheel.",
 life:"You're driving home replaying 1 sentence you said in a meeting. It's loud and it sounds like the truth. It's a passenger yelling from the back of the bus.",
 practice:{name:"Name the show",min:3,steps:["Catch 1 harsh thought today and write it down word for word.","Put 'I'm having the thought that...' in front of it.","Give it a title like a radio show. 'Oh. The Imposter Hour is on again.'"]},
 prompt:"What thought has been riding with you the longest? How old were you when it got on?",
 cards:["ac04","ac11","ac09"]},
{id:"a4",unit:"unhook",title:"The observer",
 idea:"Your story, your labels, and your moods are weather. You're the sky that's watched every version of you.",
 life:"A diagnosis, a divorce, a bad review. Each one tries to become who you are. Some part of you watched all of it happen and is still here, watching.",
 practice:{name:"Weather report",min:3,steps:["Sit somewhere you can see out a window.","Describe what you feel like a forecast: 'Heavy cloud over the chest, chance of irritation by 3.'","Notice who's giving the report."]},
 prompt:"What label have you been treating as your whole self? Who were you before it?",
 cards:["ac06","ac18","ph18","ph10"]},
{id:"a5",unit:"unhook",title:"Directions",
 idea:"Goals are places you arrive. Values are directions you never finish. That's why values survive a career change.",
 life:"You got licensed and felt flat for a week. The goal was done. 'Be someone who helps' never gets done, which is why it keeps working.",
 practice:{name:"1 values move",min:10,steps:["Write 1 value as a verb. 'To make people feel less alone.' 'To make things.'","Pick 1 action that points that way and takes under 15 minutes.","Put it on today's calendar with a time. Do it even if you feel like garbage."]},
 prompt:"What do you want your life to be about, even if nobody ever notices?",
 cards:["ac07","ac12","ac16","ph03","ph11"]},

/* ---------- 5 · CHOOSE ---------- */
{id:"c1",unit:"choose",title:"The universe owes you nothing",
 idea:"No cosmic meaning means no cosmic ledger. That's a permission slip.",
 life:"You keep waiting for it to be fair, and the grievance is its own full-time job. Drop the expectation and the same Tuesday stings less, because nothing got breached.",
 practice:{name:"Find the invoice",min:5,steps:["Write 1 thing you resent right now.","Underneath, write what you believe you were owed.","Ask who promised it. If the answer is 'the universe,' cross it out."]},
 prompt:"What did you think life owed you by now? Who sent the bill?",
 cards:["on01","on02","on03","on22","ph05"]},
{id:"c2",unit:"choose",title:"Zoom out, zoom in",
 idea:"Zoom out to right-size the pain. Zoom back in to live. The telescope is for perspective.",
 life:"Your worst day is invisible from orbit. Your kid's soccer game is 10 feet away. You need both distances, and you need to know which one you're standing at.",
 practice:{name:"The 2 zooms",min:5,steps:["Take the thing eating you today. See it from the roof, the city, the planet, the galaxy.","Stop when it's small enough to breathe around.","Zoom back to your hands. What can they do in the next hour?"]},
 prompt:"What felt enormous 5 years ago that you barely remember now?",
 cards:["on05","on13","on12","ho10","sy12"]},
{id:"c3",unit:"choose",title:"Meaning is made",
 idea:"Nobody hid a purpose for you to dig up. You write it, and the temporary kind counts.",
 life:"A meal ends and it still fed you. A song ends and it still got you. Everything you love is going to end, and you were right to love it.",
 practice:{name:"Author 1 small meaning",min:10,steps:["Pick an ordinary thing you'll do today. A commute, a meal, the walk to the car.","Decide on purpose what it's for. 'This drive is for that album.'","Do it that way and see if it feels different."]},
 prompt:"What temporary thing has meant the most to you? Does it matter that it ended?",
 cards:["on07","on08","on16","ph09","on14"]},
{id:"c4",unit:"choose",title:"Love the boulder",
 idea:"Sisyphus knows the rock rolls back and pushes anyway. Want the whole ledger, the bad pages too.",
 life:"Same inbox every Monday. Same charting. Same patient who never takes the meds. You can push it like a sentence or push it like it's yours.",
 practice:{name:"The recurrence test",min:5,steps:["Imagine you have to live today again, exactly, forever.","Find the part you'd dread repeating most.","Change 1 thing about how you'll do it tomorrow so you could stand to repeat it."]},
 prompt:"What part of your life could you say yes to forever? What part couldn't you?",
 cards:["on17","ph01","ph02","ph06","ph07","ph08","on18"]},
{id:"c5",unit:"choose",title:"The deadline",
 idea:"Death is what makes your hours worth anything. Infinite time would make every choice free, and worthless.",
 life:"The Stoics kept a skull on the desk. You've got the obituary page and knees that complain on the stairs. Same reminder.",
 practice:{name:"Memento mori minute",min:2,steps:["Once today, say it: 'I'm going to die. Probably not today.'","Ask: given that, what's this next hour for?","Spend the hour on that."]},
 prompt:"If you had 1 year left, what would you stop doing on Monday?",
 cards:["on19","ph12","ph13","ph20","tm20"]},
{id:"c6",unit:"choose",title:"Guardrails",
 idea:"'Nothing matters' is where choosing starts. Using it to check out is the failure mode.",
 life:"There's a version of this philosophy that turns into a reason to stop caring and doomscroll till 1 a.m. I've lived in that version. The magic mirror in your pocket is happy to help.",
 practice:{name:"Rest or hide?",min:5,steps:["Ask honestly: am I using 'nothing matters' to rest, or to hide?","If it's hiding, pick 1 thing you still care about and give it 10 minutes today.","Put the phone in another room while you do it."]},
 prompt:"Where has 'it doesn't matter' turned into an excuse? What would you do if it mattered a little?",
 cards:["on04","on09","on10","on11","ph19","ph04"]},

/* ---------- 6 · PRACTICE ---------- */
{id:"p1",unit:"practice",title:"Run small experiments",
 idea:"Plan, do, study, act. A cycle has no failures in it. Only information.",
 life:"Your new year's plan died on January 9. A PDSA cycle would call January 9 a data point and ask what to change.",
 practice:{name:"Start a 2-week cycle",min:15,steps:["PLAN: pick 1 behavior, specific enough to count. Write down the likely barrier.","DO: run it for 14 days. 1 line a day in Notes.","STUDY: compare your check-in trend with the 2 weeks before.","ACT: keep it, tweak it, or drop it. Then start the next cycle."]},
 prompt:"What did you quit because it 'didn't work'? What would the data have said?",
 cards:["bo17","bo18","sy09"]},
{id:"p2",unit:"practice",title:"Keep the data honest",
 idea:"In a universe with no given truths, measurement is the flashlight. It keeps your made meaning honest.",
 life:"Feelings lie about trends. 1 bad Monday convinces you nothing has changed in a year. The chart disagrees.",
 practice:{name:"Set the schedule",min:5,steps:["Daily: the 4-dial check-in. Weekly: 1 journal entry.","Monthly: retake the MBI or AAQ-II. Put it on your calendar now, repeating.","Quarterly: review the cycles you ran and what they taught you."]},
 prompt:"What do you believe about yourself that you've never checked against data?",
 cards:["on06","on21","sy10","sy15"]},
{id:"p3",unit:"practice",title:"It's the system too",
 idea:"Burnout grows in institutions that treat people as inputs. Your personal levers are real, and so is the cage.",
 life:"The EHR, the throughput metrics, the meeting about the meeting. You can do every breathing exercise ever invented and the inbox will still say 212.",
 practice:{name:"Pull 1 system lever",min:15,steps:["Write the 1 structural thing that drains you most. A workflow, a policy, a staffing gap.","Find 1 other person who hates it too.","Draft 1 concrete fix together and send it to someone who can say yes."]},
 prompt:"Which part of your burnout belongs to the system? Which part is yours to carry?",
 cards:["ph15","ph16","ph17","on15"]},
{id:"p4",unit:"practice",title:"Resilience is a skill",
 idea:"You build it rep by rep, and recovery is a garden you keep tending.",
 life:"Day 40 of doing pretty well. You skip the check-in because you're fine. That's usually the week the slide starts.",
 practice:{name:"Write a relapse plan",min:10,steps:["Write your early warning signs: the first 2 things that change when you start slipping.","Write what you'll do when you see them.","Give a copy to 1 person and ask them to say something when they notice."]},
 prompt:"What are your first signs of slipping? Who notices before you do?",
 cards:["bo20","bo21","ac13","sy08"]},
{id:"p5",unit:"practice",title:"The whole map",
 idea:"The void is the diagnosis. Cheerful is the intervention.",
 life:"Burnout brought you in. The monsters explained it. The void turned out to be a studio. Now you get to keep the lights on in there.",
 practice:{name:"Write your own protocol",min:20,steps:["Go back through Notes. Pick the 1 practice from each unit that actually worked.","Put them on 1 page. That's your protocol.","Walk the path again in 3 months and see what you'd answer differently."]},
 prompt:"What do you know now that you didn't when you started? Say it in 1 sentence.",
 cards:["bo22","bo23","on20","sy14","sy01","sy02","sy03"]}
];
